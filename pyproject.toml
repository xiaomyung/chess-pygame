[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chess-shootout"
version = "2.13.0"
description = "Full-featured local and online chess built with pygame"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "PolyForm-Noncommercial-1.0.0" }
authors = [{ name = "Xiao Myung", email = "xiaomyung.dev@gmail.com" }]
keywords = ["chess", "pygame", "game", "online", "multiplayer"]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]

dependencies = [
    "pydantic==2.13.4",
    "python-dotenv==1.0.1",
    "websockets==16.0",
]

[project.optional-dependencies]
client = [
    "pygame==2.6.1",
    "httpx==0.28.1",
    "platformdirs==4.10.0",
    "certifi==2026.5.20",
]
server = [
    "fastapi[standard]==0.115.6",
    "slowapi==0.1.9",
]
dev = [
    "chess-shootout[client,server]",
    "pytest==9.0.3",
    "pytest-xdist==3.8.0",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "coverage[toml]==7.14.1",
    "pylama~=8.4",
    "mypy==2.3.1",
    "setuptools<81",
    "toml~=0.10",
]
build = [
    "chess-shootout[client]",
    "pyinstaller>=6.11,<7",
    "pillow>=11,<12",
    "cairosvg>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/xiaomyung/chess-shootout"
Issues = "https://github.com/xiaomyung/chess-shootout/issues"

[project.scripts]
chess-shootout = "chessshootout.main:main"

[tool.hatch.build.targets.wheel]
packages = ["chessshootout"]

[tool.pylama]
linters = "pycodestyle,pyflakes"
max_line_length = 100
ignore = "E127"

[[tool.pylama.files]]
path = "tests/**"
ignore = "E402"

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["chessshootout"]
plugins = ["pydantic.mypy"]
enable_error_code = ["ignore-without-code"]

[tool.coverage.run]
source = ["chessshootout"]
